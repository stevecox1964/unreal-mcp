[project]
name = "unreal-sim"
version = "0.1.0"
description = "AI agent simulation using Unreal Engine as a 3D world — a standalone Python runtime drives NPCs over a raw TCP bridge."
readme = "README.md"
# 3.12+ is real: llm_router.py uses PEP-701 f-string syntax that 3.10/3.11
# cannot parse (both #13 worktree venvs failed at import on 3.11).
requires-python = ">=3.12"
dependencies = [
  "uvicorn",
  "fastapi",
  "pydantic>=2.6.1",
  "requests",
  "httpx>=0.25.0,<1",
  "anthropic>=0.40.0",
  "openai>=2.0.0",
  "python-dotenv>=1.0.0",
  "jinja2>=3.1.0",
  "python-multipart>=0.0.9",
  "pillow>=12.2.0",
]

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
# This is an application, not an installable package — uv must not try to
# build/install it into the venv (setuptools flat-layout discovery chokes on
# the multiple top-level dirs: agent_runtime, web_ui, worlds, ...).
package = false
