[project]
name = "unreal-sim"
version = "0.1.0"
description = "AI agent simulation using Unreal Engine as a 3D world — a standalone Python runtime drives NPCs over a raw TCP bridge."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "uvicorn",
  "fastapi",
  "pydantic>=2.6.1",
  "requests",
  "anthropic>=0.40.0",
  "openai>=2.0.0",
  "python-dotenv>=1.0.0",
  "jinja2>=3.1.0",
  "python-multipart>=0.0.9",
  "pillow>=12.2.0",
]

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"
